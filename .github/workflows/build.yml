name: Build and Upload to COPR

on:
  schedule:
    # Esegue alle 06:00 UTC il primo giorno di ogni mese
    - cron: '0 6 1 * *'
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Force a build even if no new release'
        required: false
        default: 'false'
        type: boolean
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build.yml'

concurrency:
  group: llamacpp-vulkan-rpc-build
  cancel-in-progress: true

permissions:
  contents: write

env:
  COPR_PROJECT: 'llama-cpp-vulkan-rpc'
  LLAMA_REPO: 'ggml-org/llama.cpp'
  UPSTREAM_SPEC_REPO: 'Unrest6585/fedora-llamacpp'
  CHROOTS: "fedora-45-x86_64 fedora-rawhide-x86_64"

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.check.outputs.tag }}
      version: ${{ steps.check.outputs.version }}
      should_build: ${{ steps.check.outputs.should_build }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for new llama.cpp release
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail

          META_TAG=$(gh api repos/${{ env.LLAMA_REPO }}/releases/latest --jq '.tag_name')

          if [ -z "${META_TAG}" ] || [ "${META_TAG}" = "null" ]; then
            echo "Error: Could not get latest release tag"
            exit 1
          fi

          if [[ ! "${META_TAG}" =~ ^v[0-9]+(\.[0-9]+)*$ ]]; then
            echo "Error: latest release tag '${META_TAG}' is not a vX.Y.Z version"
            exit 1
          fi
          VERSION="${META_TAG#v}"

          TAG=$(curl -sfL "https://github.com/${{ env.LLAMA_REPO }}/releases/download/${META_TAG}/nightly-tag.txt" | tr -d '[:space:]')

          if [[ ! "${TAG}" =~ ^b[0-9]+$ ]]; then
            echo "Error: nightly-tag.txt from ${META_TAG} did not yield a bXXXX tag (got '${TAG}')"
            exit 1
          fi

          echo "Latest release: ${META_TAG} (pinned build: ${TAG})"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

          LAST_TAG=""
          if [ -f state/last_version ]; then
            LAST_TAG=$(cat state/last_version | tr -d '[:space:]')
          fi
          echo "Last built: ${LAST_TAG:-<none>}"

          if [ "${{ github.event.inputs.force_build }}" = "true" ]; then
            echo "should_build=true" >> $GITHUB_OUTPUT
            echo "Force build requested"
          elif [ "${{ github.event_name }}" = "push" ]; then
            echo "should_build=true" >> $GITHUB_OUTPUT
            echo "Push event - rebuilding with updated workflow"
          elif [ "${TAG}" = "${LAST_TAG}" ]; then
            echo "should_build=false" >> $GITHUB_OUTPUT
            echo "Version ${TAG} already built, skipping"
          else
            echo "should_build=true" >> $GITHUB_OUTPUT
            echo "New version ${TAG} - will build"
          fi

  build:
    needs: check-version
    if: needs.check-version.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: fedora:43
    steps:
      - name: Install dependencies
        run: |
          dnf install -y \
            git \
            gh \
            rpm-build \
            rpmdevtools \
            python3 \
            python3-copr \
            copr-cli \
            wget \
            curl

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup RPM build tree
        run: rpmdev-setuptree

      - name: Download llama.cpp source tarball
        run: |
          SRC="v${{ needs.check-version.outputs.version }}"
          wget "https://github.com/${{ env.LLAMA_REPO }}/archive/refs/tags/${SRC}.tar.gz" \
            -O ~/rpmbuild/SOURCES/${SRC}.tar.gz
          echo "Downloaded: ${SRC}.tar.gz ($(du -sh ~/rpmbuild/SOURCES/${SRC}.tar.gz | cut -f1))"

      - name: Download prebuilt web UI artifact
        run: |
          TAG="${{ needs.check-version.outputs.tag }}"
          wget --tries=5 --retry-connrefused --waitretry=10 \
            "https://github.com/${{ env.LLAMA_REPO }}/releases/download/${TAG}/llama-${TAG}-ui.tar.gz" \
            -O ~/rpmbuild/SOURCES/llama-${TAG}-ui.tar.gz
          echo "Downloaded: llama-${TAG}-ui.tar.gz ($(du -sh ~/rpmbuild/SOURCES/llama-${TAG}-ui.tar.gz | cut -f1))"

      - name: Fetch upstream spec and apply RPC + Vulkan patches
        run: |
          UPSTREAM_MAIN="https://raw.githubusercontent.com/${{ env.UPSTREAM_SPEC_REPO }}/main/llama-cpp.spec"
          curl -fsSL "$UPSTREAM_MAIN" -o /tmp/upstream.spec

          python3 - <<'EOF'
          import os, re
          from datetime import datetime, timezone

          version = "${{ needs.check-version.outputs.version }}"
          upstream_tag = "${{ needs.check-version.outputs.tag }}"

          with open("/tmp/upstream.spec", "r", encoding="utf-8") as f:
              content = f.read()

          header = (
              "# Based on the RPM spec file originally created by Unrest6585 (https://github.com)\n"
              "# Modified to enable GGML_RPC=ON and package ggml-rpc-server\n\n"
          )
          content = header + content

          content = re.sub(r'^%global upstream_tag\s+.*', f'%global upstream_tag {upstream_tag}', content, flags=re.M)
          content = re.sub(r'^Name:\s+.*', 'Name:           llama-cpp-vulkan-rpc', content, flags=re.M)
          content = re.sub(r'^Version:\s+.*', f'Version:        {version}', content, flags=re.M)
          content = re.sub(r'^Release:\s+.*', 'Release:        1%{?dist}', content, flags=re.M)
          content = re.sub(r'^Summary:\s+.*', 'Summary:        LLM inference engine in C/C++ with Vulkan GPU and RPC acceleration', content, flags=re.M)

          content = content.replace(
              "Vulkan-capable GPU (AMD, Intel, NVIDIA).",
              "Vulkan-capable GPU (AMD, Intel, NVIDIA) and distributed RPC server support (ggml-rpc-server)."
          )
          content = content.replace(
              "including the Vulkan compute backend.",
              "including the Vulkan and RPC compute backends."
          )

          if "-DGGML_RPC=ON" not in content:
              content = content.replace(
                  "-DGGML_VULKAN=ON \\",
                  "-DGGML_VULKAN=ON \\\n    -DGGML_RPC=ON \\"
              )

          content = content.replace(
              "! -name 'llama-*' -delete",
              "! -name 'llama-*' ! -name 'ggml-rpc-server' -delete"
          )

          if "%{_bindir}/ggml-rpc-server" not in content:
              content = content.replace(
                  "%{_bindir}/llama-*",
                  "%{_bindir}/llama-*\n%{_bindir}/ggml-rpc-server"
              )

          changelog_date = datetime.now(timezone.utc).strftime("%a %b %d %Y")
          new_entry = (
              f"%changelog\n"
              f"* {changelog_date} GitHub Actions <noreply@github.com> - {version}-1\n"
              f"- Automated build based on Unrest6585/fedora-llamacpp with -DGGML_RPC=ON and ggml-rpc-server\n"
          )
          content = content.replace("%changelog\n", new_entry, 1)

          spec_path = os.path.expanduser("~/rpmbuild/SPECS/llama-cpp-vulkan-rpc.spec")
          with open(spec_path, "w", encoding="utf-8") as f:
              f.write(content)
          EOF

          cp ~/rpmbuild/SPECS/llama-cpp-vulkan-rpc.spec $GITHUB_WORKSPACE/llama-cpp-vulkan-rpc.spec

      - name: Build SRPM
        run: |
          rpmbuild -bs ~/rpmbuild/SPECS/llama-cpp-vulkan-rpc.spec

          SRPM=$(ls -1t ~/rpmbuild/SRPMS/llama-cpp-vulkan-rpc-*.src.rpm | head -1)
          echo "Built SRPM: ${SRPM}"
          cp "${SRPM}" $GITHUB_WORKSPACE/
          echo "BUILT_SRPM=$(basename ${SRPM})" >> $GITHUB_ENV

      - name: Publish SRPM to GitHub Releases
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd $GITHUB_WORKSPACE
          git config --global --add safe.directory $GITHUB_WORKSPACE
          TAG="${{ needs.check-version.outputs.tag }}"
          SRPM="$GITHUB_WORKSPACE/${{ env.BUILT_SRPM }}"
          gh release delete "${TAG}" --yes 2>/dev/null || true
          gh release create "${TAG}" \
            --target main \
            --title "llama-cpp-vulkan-rpc ${{ needs.check-version.outputs.version }} (${TAG})" \
            --notes "Source RPM for llama-cpp-vulkan-rpc ${{ needs.check-version.outputs.version }} (upstream build ${TAG})" \
            "${SRPM}"
          SRPM_URL="https://github.com/${{ github.repository }}/releases/download/${TAG}/${{ env.BUILT_SRPM }}"
          echo "SRPM_URL=${SRPM_URL}" >> $GITHUB_ENV
          echo "SRPM published to: ${SRPM_URL}"

      - name: Setup COPR credentials
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p ~/.config
          printf '%s\n' \
            '[copr-cli]' \
            'login = ${{ secrets.COPR_LOGIN }}' \
            'username = ${{ secrets.COPR_USERNAME }}' \
            'token = ${{ secrets.COPR_TOKEN }}' \
            'copr_url = https://copr.fedorainfracloud.org' \
            > ~/.config/copr

      - name: Upload to COPR
        if: github.event_name != 'pull_request'
        run: |
          CHROOT_ARGS=()
          for chroot in ${{ env.CHROOTS }}; do
            CHROOT_ARGS+=(--chroot "$chroot")
          done
          copr-cli build "${{ env.COPR_PROJECT }}" "${{ env.SRPM_URL }}" "${CHROOT_ARGS[@]}" --nowait

      - name: Save built version and spec to repo
        if: github.event_name != 'pull_request'
        run: |
          cd $GITHUB_WORKSPACE
          git config --global --add safe.directory $GITHUB_WORKSPACE
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@://github.com"
          mkdir -p state
          echo "${{ needs.check-version.outputs.tag }}" > state/last_version
          git add state/last_version llama-cpp-vulkan-rpc.spec
          if ! git diff --staged --quiet; then
            git commit -m "chore: record built version ${{ needs.check-version.outputs.tag }}"
            git push
          else
            echo "Nessuna modifica da salvare nel repository."
          fi
